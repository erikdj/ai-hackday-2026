# Inject credentials with Doppler. Never mount the multi-agent secret YAML.
x-environment: &agent-environment
  CRUSOE_API_KEY: "${CRUSOE_API_KEY:-}"
  CRUSOE_BASE_URL: "${CRUSOE_BASE_URL:-https://api.inference.crusoecloud.com/v1}"
  CRUSOE_MODEL_FAST: "${CRUSOE_MODEL_FAST:-}"
  CRUSOE_MODEL_STRONG: "${CRUSOE_MODEL_STRONG:-}"
  CRUSOE_MODEL_CRITIC: "${CRUSOE_MODEL_CRITIC:-}"
  CRUSOE_FAMILY_STRONG: "${CRUSOE_FAMILY_STRONG:-}"
  CRUSOE_FAMILY_CRITIC: "${CRUSOE_FAMILY_CRITIC:-}"
  CRUSOE_MODEL_FALLBACK: "${CRUSOE_MODEL_FALLBACK:-}"
  CRUSOE_MODEL_FAST_FALLBACK: "${CRUSOE_MODEL_FAST_FALLBACK:-}"
  CRUSOE_MODEL_STRONG_FALLBACK: "${CRUSOE_MODEL_STRONG_FALLBACK:-}"
  CRUSOE_MODEL_CRITIC_FALLBACK: "${CRUSOE_MODEL_CRITIC_FALLBACK:-}"
  CRUSOE_DISABLE_THINKING_MODELS: "${CRUSOE_DISABLE_THINKING_MODELS:-}"
  ENABLE_APPROVED_ROOM: "${ENABLE_APPROVED_ROOM:-0}"
  ENABLE_DRUG_RESEARCH: "${ENABLE_DRUG_RESEARCH:-0}"
  BAND_DESK_AGENT_ID: "${BAND_DESK_AGENT_ID:-}"
  BAND_SCRIBE_AGENT_ID: "${BAND_SCRIBE_AGENT_ID:-}"
  BAND_RESEARCHER_AGENT_ID: "${BAND_RESEARCHER_AGENT_ID:-}"
  BAND_CRITIC_AGENT_ID: "${BAND_CRITIC_AGENT_ID:-}"
  BAND_GRAPHER_AGENT_ID: "${BAND_GRAPHER_AGENT_ID:-}"
  BAND_CLOSER_AGENT_ID: "${BAND_CLOSER_AGENT_ID:-}"

x-agent: &agent
  build: .
  user: "${HALLWAY_UID:-1000}:${HALLWAY_GID:-1000}"
  restart: unless-stopped
  init: true

# Desk and its private pseudonym salt remain on the presenting laptop.
services:
  scribe:
    <<: *agent
    command: ["python", "-m", "hallway.agents.scribe"]
    environment:
      <<: *agent-environment
      BAND_SCRIBE_API_KEY: "${BAND_SCRIBE_API_KEY:-}"
  researcher:
    <<: *agent
    profiles: ["phase2"]
    command: ["python", "-m", "hallway.agents.researcher"]
    environment:
      <<: *agent-environment
      BAND_RESEARCHER_API_KEY: "${BAND_RESEARCHER_API_KEY:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      MOCK_BRAVE: "${MOCK_BRAVE:-0}"
  critic:
    <<: *agent
    command: ["python", "-m", "hallway.agents.critic"]
    environment:
      <<: *agent-environment
      BAND_CRITIC_API_KEY: "${BAND_CRITIC_API_KEY:-}"
  grapher:
    <<: *agent
    profiles: ["phase2"]
    command: ["python", "-m", "hallway.agents.grapher"]
    environment:
      <<: *agent-environment
      BAND_GRAPHER_API_KEY: "${BAND_GRAPHER_API_KEY:-}"
      NEO4J_URI: "${NEO4J_URI:-}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-}"
      MOCK_NEO4J: "${MOCK_NEO4J:-0}"
  closer:
    <<: *agent
    profiles: ["deferred"]
    command: ["python", "-m", "hallway.agents.closer"]
    environment:
      <<: *agent-environment
      BAND_CLOSER_API_KEY: "${BAND_CLOSER_API_KEY:-}"
